{% extends "base.html" %}
{% block title %}Create Account | SkillGap AI{% endblock %}
{% block auth_content %}
<div class="auth-card">
<div class="auth-logo">S</div><p class="eyebrow">GET STARTED</p><h1>Create your account</h1>
<form method="post" class="form">
<label>Full name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="6" required></label>
<label>Confirm password<input type="password" name="confirm_password" minlength="6" required></label>
<button class="btn primary full">Create Account</button>
</form>
<p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
