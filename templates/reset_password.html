
{% extends "base.html" %}
{% block title %}Reset Password | SkillGap AI{% endblock %}
{% block auth_content %}
<div class="auth-card">
<div class="auth-logo">S</div><p class="eyebrow">RESET PASSWORD</p><h1>Create a new password</h1>
<form method="post" class="form">
<label>New password<input type="password" name="password" minlength="6" required></label>
<label>Confirm password<input type="password" name="confirm_password" minlength="6" required></label>
<button class="btn primary full">Reset Password</button>
</form>
</div>
{% endblock %}
